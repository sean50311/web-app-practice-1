<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Task Manager (React)</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [tasks, setTasks] = useState([]);
            const [text, setText] = useState('');

            function addTask() {
                const task = text.trim();
                if (task) {
                    setTasks([...tasks, {id: Date.now(), text: task, completed: false}]);
                    setText('');
                }
            }

            function toggleTask(id) {
                setTasks(tasks.map(t => t.id === id ? {...t, completed: !t.completed} : t));
            }

            function deleteTask(id) {
                setTasks(tasks.filter(t => t.id !== id));
            }

            return (
                <>
                    <header>
                        <h1>My Task Manager (React)</h1>
                    </header>
                    <main>
                        <section>
                            <h2>新增任務</h2>
                            <label htmlFor="new-task">新增任務</label>
                            <input
                                type="text"
                                id="new-task"
                                value={text}
                                onChange={e => setText(e.target.value)}
                            />
                            <button type="button" id="add-task" onClick={addTask}>新增</button>
                        </section>
                        <section>
                            <h2>任務列表</h2>
                            <ul id="task-list-container">
                                {tasks.map(task => (
                                    <li key={task.id}>
                                        <input
                                            type="checkbox"
                                            checked={task.completed}
                                            onChange={() => toggleTask(task.id)}
                                        />
                                        <span>{task.text}</span>
                                        <button type="button" onClick={() => deleteTask(task.id)}>刪除</button>
                                    </li>
                                ))}
                            </ul>
                        </section>
                    </main>
                </>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
